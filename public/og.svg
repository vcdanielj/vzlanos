<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<clipPath id="flagclip"><rect x="960" y="70" width="180" height="120" rx="12" /></clipPath>
		<path id="ostar" d="M0,-1 L0.2245,-0.309 L0.9511,-0.309 L0.3633,0.118 L0.5878,0.809 L0,0.382 L-0.5878,0.809 L-0.3633,0.118 L-0.9511,-0.309 L-0.2245,-0.309 Z" fill="#ffffff" />
	</defs>
	<rect width="1200" height="630" fill="#ffffff" />
	<!-- Barra tricolor superior -->
	<rect x="0" y="0" width="400" height="12" fill="#FCD116" />
	<rect x="400" y="0" width="400" height="12" fill="#00247D" />
	<rect x="800" y="0" width="400" height="12" fill="#CF142B" />
	<!-- Bandera (chip) -->
	<g clip-path="url(#flagclip)">
		<rect x="960" y="70" width="180" height="40" fill="#FCD116" />
		<rect x="960" y="110" width="180" height="40" fill="#00247D" />
		<rect x="960" y="150" width="180" height="40" fill="#CF142B" />
		<use href="#ostar" transform="translate(1005,133) scale(4)" />
		<use href="#ostar" transform="translate(1018,131) scale(4)" />
		<use href="#ostar" transform="translate(1031,129) scale(4)" />
		<use href="#ostar" transform="translate(1044,127) scale(4)" />
		<use href="#ostar" transform="translate(1057,127) scale(4)" />
		<use href="#ostar" transform="translate(1070,129) scale(4)" />
		<use href="#ostar" transform="translate(1083,131) scale(4)" />
		<use href="#ostar" transform="translate(1096,133) scale(4)" />
	</g>
	<!-- Texto -->
	<text x="90" y="285" font-family="Helvetica, Arial, sans-serif" font-size="130" font-weight="700" fill="#0f172a">vzlanos</text>
	<text x="92" y="375" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="600" fill="#1e293b">Encuentra y reúne a los tuyos</text>
	<text x="92" y="448" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#64748b">Reporta · Comparte tu ubicación · Busca a tu familia</text>
	<!-- Subrayado tricolor -->
	<rect x="92" y="500" width="140" height="10" rx="5" fill="#FCD116" />
	<rect x="232" y="500" width="140" height="10" rx="5" fill="#00247D" />
	<rect x="372" y="500" width="140" height="10" rx="5" fill="#CF142B" />
</svg>
